<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Netlify Form Detection Helper</title>
</head>
<body>
  <!-- Static hidden form for Netlify Form Detection with App Router -->
  <form name="konsultasi" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="bot-field" />
    <input type="hidden" name="form-name" value="konsultasi" />
    <input type="text" name="name" />
    <input type="tel" name="whatsapp" />
    <input type="email" name="email" />
    <input type="text" name="city" />
    <input type="text" name="interest" />
    <input type="text" name="budget" />
    <textarea name="message"></textarea>
    <input type="checkbox" name="privacy" />
  </form>
</body>
</html>
